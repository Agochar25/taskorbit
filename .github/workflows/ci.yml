name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: taskorbit, POSTGRES_PASSWORD: taskorbit, POSTGRES_DB: taskorbit_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskorbit" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://taskorbit:taskorbit@localhost:5432/taskorbit_test?schema=public
      JWT_ACCESS_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm install
      - run: npx prisma db push --skip-generate
        working-directory: backend
      - run: npm test
        working-directory: backend

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm install --ignore-scripts
      - run: npm run build --workspace web
